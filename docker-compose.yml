version: '3.8'

services:
  # ─── MySQL Primary ────────────────────────────────────────────────
  mysql-primary:
    image: mysql:8.0
    container_name: varahi-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jaivarahi}
      MYSQL_USER: ${MYSQL_USER:-jaivarahi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jaivarahi}
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - varahi-network

  # ─── MySQL Replica ────────────────────────────────────────────────
  mysql-replica:
    image: mysql:8.0
    container_name: varahi-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jaivarahi}
      MYSQL_USER: ${MYSQL_USER:-jaivarahi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jaivarahi}
    volumes:
      - mysql-replica-data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --read-only=1
      --super-read-only=1
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      - varahi-network

  # ─── Redis Cluster (Single node for dev, 3+ for prod) ─────────────
  redis:
    image: redis:7-alpine
    container_name: varahi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - varahi-network

  # ─── Backend API ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: varahi-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: mysql-primary
      MYSQL_REPLICA_HOSTS: mysql-replica
      MYSQL_USER: ${MYSQL_USER:-jaivarahi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jaivarahi}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jaivarahi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      REDIS_URL: redis://redis:6379
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jaivarahi.org}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      VITE_RAZORPAY_KEY: ${VITE_RAZORPAY_KEY:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://jaivarahi.org,https://www.jaivarahi.org}
      DB_HEALTH_CHECK: "1"
    ports:
      - "5000:5000"
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - varahi-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── NGINX Load Balancer ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: varahi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - varahi-network

  # ─── Prometheus Monitoring ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: varahi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - varahi-network

  # ─── Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: varahi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - varahi-network

volumes:
  mysql-primary-data:
  mysql-replica-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  varahi-network:
    driver: bridge